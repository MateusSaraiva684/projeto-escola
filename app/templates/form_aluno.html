<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Aluno — Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; border-radius: 14px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/alunos/web">
            <i class="fa fa-school me-2"></i>Sistema Escolar
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h4 class="text-center mb-4">
                    <i class="fa fa-user-plus me-2 text-primary"></i>Cadastrar Aluno
                </h4>

                <form action="/alunos/web" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" name="nome" class="form-control" placeholder="Nome completo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone <span class="text-danger">*</span></label>
                        <input type="text" name="telefone" class="form-control" placeholder="(88) 99999-9999" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Foto <small class="text-muted">(JPEG ou PNG, máx. 5 MB)</small></label>
                        <input type="file" name="foto" class="form-control" accept="image/jpeg,image/png,image/webp">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/alunos/web" class="btn btn-secondary">
                            <i class="fa fa-arrow-left me-1"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save me-1"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
