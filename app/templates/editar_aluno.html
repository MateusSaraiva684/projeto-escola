<!DOCTYPE html>
<html>
<head>
    <title>Editar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">🎓 Sistema Escolar</span>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">Editar Aluno</h3>

                <form method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{ aluno.nome }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" name="telefone" class="form-control" value="{{ aluno.telefone }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nova Foto</label>
                        <input type="file" name="foto" class="form-control">
                    </div>

                    {% if aluno.foto %}
                    <div class="mb-3 text-center">
                        <img src="{{ aluno.foto }}" style="height: 150px; object-fit: cover;">
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-between">
                        <a href="/alunos/web" class="btn btn-secondary">Voltar</a>
                        <button type="submit" class="btn btn-warning">Atualizar</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
